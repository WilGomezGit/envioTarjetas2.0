<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinar PDFs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="titleContainer">
        <button class="home-button" onclick="location.href='../index.html'"> Inicio </button>
        <h1>Combinar PDFs</h1>
        <p class="subtitle">Detecta el orden y empareja cada oficio con su reporte</p>
    </div>

    <div class="file-button-container">
        <div class="drop-zone-wrapper">
            <label class="file-label">📄 PDF de los Oficios</label>
            <div id="dropZone1" class="drop-zone">
                <div class="drop-icon">📁</div>
                <span class="drop-text">Arrastra el PDF de los Oficios aquí</span>
                <span class="drop-subtext">o haz clic para seleccionarlo</span>
                <input type="file" id="pdfFile1" class="file-input-hidden" accept="application/pdf">
            </div>
        </div>

        <div class="drop-zone-wrapper">
            <label class="file-label">📄 PDF de las Empresas (Reportes)</label>
            <div id="dropZone2" class="drop-zone">
                <div class="drop-icon">📁</div>
                <span class="drop-text">Arrastra el PDF de los Reportes aquí</span>
                <span class="drop-subtext">o haz clic para seleccionarlo</span>
                <input type="file" id="pdfFile2" class="file-input-hidden" accept="application/pdf">
            </div>
        </div>

        <div class="button-container">
            <button class="action-button" onclick="combinarPDFs()">Combinar</button>
            <button class="action-button cancel-button" onclick="clearInputs()">Cancelar</button>
        </div>
    </div>

    <div class="output-container">
        <div id="message"></div>
        <div id="validationReport"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="scripts.js"></script>
</body>
</html>
